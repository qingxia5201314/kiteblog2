name: Deploy blog

# Publish the static site whenever new source lands on main.
#
# Flow: push to main -> GitHub runner SSHes to the VPS -> fast-forward the
# canonical checkout at /opt/kitepop-hexo-standard -> run operations/publish.sh,
# which renders Hexo into a timestamped directory and atomically swaps the
# /var/www/myblog-arknights symlink. No manual step is required.
#
# Required repository secrets:
#   VPS_SSH_KEY   private half of the gh-actions-deploy keypair (OpenSSH format)
#   VPS_HOST      e.g. 104.225.238.193  (IP or hostname, no brackets)
#   VPS_USER      e.g. root
#   VPS_PORT      optional, defaults to 22

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you publishing manually?
        required: false
        default: manual republish

# Never let two deploys race for the symlink; queue them instead.
concurrency:
  group: blog-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Render and publish on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare SSH agent
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?secret VPS_SSH_KEY is not set}"
          : "${VPS_HOST:?secret VPS_HOST is not set}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_KEY_FILE=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=${VPS_PORT:-22}" >> "$GITHUB_ENV"

      - name: Sync source to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          : "${VPS_USER:?secret VPS_USER is not set}"
          SSH="ssh -i $SSH_KEY_FILE -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes"
          $SSH "$VPS_USER@$VPS_HOST" 'set -euo pipefail
            cd /opt/kitepop-hexo-standard
            git fetch --prune origin main
            git reset --hard origin/main
            git submodule update --init --recursive
            git log --oneline -1'

      - name: Render and publish
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $SSH_KEY_FILE -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes"
          $SSH "$VPS_USER@$VPS_HOST" 'set -euo pipefail
            cd /opt/kitepop-hexo-standard
            bash operations/publish.sh
            echo "--- live release ---"
            readlink -f /var/www/myblog-arknights
            ls /var/www/myblog-arknights/index.html'

      - name: Smoke-test the live site
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://kitepop.top/)
          echo "https://kitepop.top/ -> $code"
          test "$code" = "200"
