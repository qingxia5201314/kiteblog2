name: Deploy blog

# Publish the static site whenever new source lands on main.
#
# Flow: push to main -> GitHub runner SSHes to the VPS -> fast-forward the
# canonical checkout at /opt/kitepop-hexo-standard -> run operations/publish.sh,
# which renders Hexo into a timestamped directory and atomically swaps the
# /var/www/myblog-arknights symlink. No manual step is required.
#
# Every release is a fresh ~44 MB directory, so the job also prunes old
# releases and source backups to keep a disk that is already ~80% full from
# filling up.
#
# Required repository secrets:
#   VPS_SSH_KEY   private half of the gh-actions-deploy keypair (OpenSSH format)
#   VPS_HOST      IP or hostname of the VPS, no brackets
#   VPS_USER      SSH user, e.g. your deploy user
#   VPS_PORT      optional, defaults to 22
#
# Content lives elsewhere: /opt/kitepop-hexo-standard/source is a symlink into
# /opt/kitepop-content/source, a separate git repository on the VPS that this
# workflow must never reset (see operations/migrate-content-split.sh). Only
# code is synchronised here.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you publishing manually?
        required: false
        default: manual republish

# Never let two deploys race for the symlink; queue them instead.
concurrency:
  group: blog-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep this release plus the newest few, so a bad deploy can still be
  # rolled back by hand.
  KEEP_RELEASES: "5"
  KEEP_BACKUPS: "10"

jobs:
  deploy:
    name: Render and publish on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare SSH agent
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?secret VPS_SSH_KEY is not set}"
          : "${VPS_HOST:?secret VPS_HOST is not set}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "SSH_KEY_FILE=$HOME/.ssh/deploy_key" >> "$GITHUB_ENV"
          echo "DEPLOY_PORT=${VPS_PORT:-22}" >> "$GITHUB_ENV"

      - name: Sync source to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          : "${VPS_USER:?secret VPS_USER is not set}"
          SSH="ssh -i $SSH_KEY_FILE -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes"
          REMOTE=$(cat <<'REMOTE'
          set -euo pipefail
          cd /opt/kitepop-hexo-standard
          git fetch --prune origin main
          git reset --hard origin/main
          git submodule update --init --recursive
          git log --oneline -1
          REMOTE
          )
          printf '%s\n' "$REMOTE" | $SSH "$VPS_USER@$VPS_HOST" bash -s

      - name: Verify the content symlink survived the reset
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $SSH_KEY_FILE -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes"
          # `git reset --hard` above only touches the code repo, so the content
          # symlink should still point at the content repo. If it does not, the
          # render would publish an empty site -- stop here instead.
          REMOTE=$(cat <<'REMOTE'
          set -euo pipefail
          cd /opt/kitepop-hexo-standard
          if [ ! -e source ]; then
            echo "content link missing after reset" >&2
            exit 1
          fi
          test -L source
          test -d source
          test -n "$(ls -A source)"
          printf 'content link ok: %s -> %s (%s files)\n' \
            source "$(readlink source)" "$(find source/ -type f | wc -l)"
          REMOTE
          )
          printf '%s\n' "$REMOTE" | $SSH "$VPS_USER@$VPS_HOST" bash -s

      - name: Render and publish
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $SSH_KEY_FILE -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes"
          REMOTE=$(cat <<'REMOTE'
          set -euo pipefail
          cd /opt/kitepop-hexo-standard
          bash operations/publish.sh
          echo "--- live release ---"
          readlink -f /var/www/myblog-arknights
          ls /var/www/myblog-arknights/index.html
          REMOTE
          )
          printf '%s\n' "$REMOTE" | $SSH "$VPS_USER@$VPS_HOST" bash -s

      - name: Prune old releases and backups
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i $SSH_KEY_FILE -p $DEPLOY_PORT -o BatchMode=yes -o IdentitiesOnly=yes"
          # Retention counts go in as positional args so they expand on the VPS,
          # not on the runner where they would silently be empty (and would then
          # delete every release, including the live one).
          REMOTE=$(cat <<'REMOTE'
          set -euo pipefail
          keep_releases="$1"
          keep_backups="$2"
          live="$(readlink -f /var/www/myblog-arknights)"

          # Delete releases older than the newest $keep_releases, never the live one.
          ls -dt /var/www/myblog-arknights-* 2>/dev/null \
            | tail -n "+$((keep_releases + 1))" \
            | while IFS= read -r dir; do
                if [ "$dir" = "$live" ]; then
                  echo "skip (live): $dir"
                  continue
                fi
                echo "removing release: $dir"
                rm -rf -- "$dir"
              done

          # Same retention for the source tarballs written by publish.sh.
          ls -dt /opt/kitepop-backups/hexo-source-*.tar.gz 2>/dev/null \
            | tail -n "+$((keep_backups + 1))" \
            | while IFS= read -r file; do
                echo "removing backup: $file"
                rm -f -- "$file"
              done

          echo "--- remaining releases ---"
          ls -d /var/www/myblog-arknights-* 2>/dev/null | wc -l
          echo "--- disk ---"
          df -h / | tail -1
          REMOTE
          )
          printf '%s\n' "$REMOTE" \
            | $SSH "$VPS_USER@$VPS_HOST" bash -s -- "$KEEP_RELEASES" "$KEEP_BACKUPS"

      - name: Smoke-test the live site
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://kitepop.top/)
          echo "https://kitepop.top/ -> $code"
          test "$code" = "200"
